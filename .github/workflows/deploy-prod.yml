name: Deploy to Production (AWS)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: justsku-api
  APP_RUNNER_SERVICE_NAME: justsku-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: docker-build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -f backend/Dockerfile \
                       backend/..
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update App Runner service
        id: deploy-apprunner
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --region ${{ env.AWS_REGION }} \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_NAME }}'].ServiceArn" \
            --output text)
          
          echo "Service ARN: $SERVICE_ARN"
          
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration ImageRepository={ImageIdentifier=${{ steps.docker-build.outputs.image }},ImageConfiguration={Port=8080},ImageRepositoryType=ECR}
          
          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          aws apprunner wait service-updated \
            --service-arn ${{ steps.deploy-apprunner.outputs.service_arn }} \
            --region ${{ env.AWS_REGION }}

      - name: Build and deploy Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          
          # Sync to S3
          aws s3 sync dist/ s3://justsku-frontend-prod \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          
          # index.html should not be cached
          aws s3 cp dist/index.html s3://justsku-frontend-prod/index.html \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='justsku-frontend-prod.s3.amazonaws.com'].Id" \
            --output text)
          
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo "Backend: ${{ steps.docker-build.outputs.image }}"
          echo "Frontend: S3 + CloudFront"
          echo "Service: https://api.justsku.com"

      - name: Slack Notification (Optional)
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "JUSTSKU Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ job.status == 'success' && '✅' || '❌' }} Deployment to Production*\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
